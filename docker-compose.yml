services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: .
    environment:
      DATABASE_URL: postgres://auth:auth@db:5432/auth?sslmode=disable
      JWT_SECRET: change-me-in-production
      PORT: "8080"
      GRPC_PORT: "9090"
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
