# Self-contained dev stack: auth plus its own throwaway postgres and redis.
# Use `make dev-up`. The default stack (compose.yaml) instead attaches to the
# shared `ecosystem` network from ecosystem-infra.
# It publishes the same host ports as ecosystem-infra, so stop infra first or
# override DEV_POSTGRES_PORT / DEV_REDIS_PORT / PORT / GRPC_PORT.
name: ecosystem-auth-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: .
    # Run as the host user so the read-only ./keys mount (0600 private keys)
    # is readable; falls back to the image's nonroot uid.
    user: "${DOCKER_USER:-65532:65532}"
    environment:
      DATABASE_URL: postgres://auth:auth@db:5432/auth?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_KEYS_DIR: /keys
      PORT: "8080"
      GRPC_PORT: "9090"
    volumes:
      - ./keys:/keys:ro
    ports:
      - "${PORT:-8080}:8080"
      - "${GRPC_PORT:-9090}:9090"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
